name: check and deploy
# Every push runs the check. A push to main that passes it publishes the site; one that fails publishes nothing.
# Only the files named in "Stage the public files" go out: tools/, README.md, PLACEHOLDERS.md and .github/ never do.
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check_site.py
      - name: Stage the public files
        run: |
          mkdir _site
          cp -R index.html 404.html CNAME robots.txt sitemap.xml .nojekyll assets de privacy legal-notice press _site/
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
